<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>SAYFER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c; --s1:#0e1016; --s2:#141822; --s3:#1a1f2c;
  --bd:rgba(255,255,255,.06); --bd2:rgba(255,255,255,.12);
  --tx:#f4f6fb; --t2:#8a91a4; --t3:#565c6e;
  --a1:#f0dcaa; --a2:#d4af6a; --a3:#8b6f3a;
  --up:#22c55e; --dn:#ef4444; --info:#5b8fff;
  --r:20px; --r2:14px; --r3:10px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none}
body{position:fixed;inset:0}
button,input,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
input{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:0;height:0}
input[inputmode="decimal"]{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ==================== LOCK ==================== */
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  padding:calc(28px + var(--st)) 24px calc(24px + var(--sb));
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(212,175,106,.14), transparent 65%),
    radial-gradient(80% 50% at 50% 108%, rgba(91,143,255,.08), transparent 65%),
    var(--bg);
  transition:opacity .45s ease, transform .45s ease}
#lock.hide{opacity:0;pointer-events:none;transform:scale(1.03)}
.lk-top{display:flex;flex-direction:column;align-items:center;margin-top:auto;margin-bottom:auto}
.lk-mark{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(150deg,#1a1f2c,#0e1016);
  border:1px solid rgba(212,175,106,.28);
  box-shadow:0 24px 60px -22px rgba(212,175,106,.4),inset 0 1px 0 rgba(255,255,255,.06);
  margin-bottom:26px}
.lk-mark svg{width:28px;height:28px;stroke:var(--a1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk-title{font-size:30px;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.5));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lk-sub{margin-top:8px;font-size:13px;color:var(--t2);letter-spacing:.2px}
.lk-dots{display:flex;gap:14px;margin:34px 0 26px}
.lk-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.24);transition:all .22s}
.lk-dot.on{background:var(--a2);border-color:var(--a2);box-shadow:0 0 14px rgba(212,175,106,.65);transform:scale(1.15)}
.lk-dot.err{border-color:var(--dn);background:var(--dn);box-shadow:0 0 14px rgba(239,68,68,.6)}
.lk-msg{height:18px;font-size:12.5px;color:var(--dn);opacity:0;transition:opacity .2s;margin-top:14px}
.lk-msg.on{opacity:1}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;width:100%;margin:0 auto}
.lk-key{height:62px;border-radius:50%;display:grid;place-items:center;
  font-size:24px;font-weight:500;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);transition:all .12s}
.lk-key:active{transform:scale(.92);background:rgba(255,255,255,.1)}
.lk-key.ghost{background:none;border:none}
.lk-key svg{width:22px;height:22px;stroke:var(--t2);fill:none;stroke-width:1.8}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#lock.shake{animation:shake .38s}
.lk-foot{margin-top:auto;text-align:center;font-size:11px;color:var(--t3);line-height:1.5}
@media (max-height:600px){
  .lk-mark{width:52px;height:52px;border-radius:16px;margin-bottom:16px}
  .lk-title{font-size:24px}.lk-sub{margin-top:4px;font-size:12px}
  .lk-dots{margin:20px 0 16px}
  .lk-key{height:48px;font-size:20px}
}

/* ==================== APP SHELL ==================== */
#app{position:fixed;inset:0;display:none;flex-direction:column;padding-left:var(--sl);padding-right:var(--sr)}
#app.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;
  padding:calc(12px + var(--st)) 18px 10px;
  flex-shrink:0;max-width:720px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--a1),var(--a3));color:#1a1407;
  font-weight:900;font-size:14px;letter-spacing:-.5px;
  box-shadow:0 8px 20px -8px rgba(212,175,106,.6)}
.brand-text{min-width:0}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:10.5px;color:var(--t2);margin-top:1px;letter-spacing:.4px}
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--bd);transition:transform .15s,background .15s}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.icon-btn svg{width:17px;height:17px;stroke:var(--a1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#2a3142,#141822);
  border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--a1);flex-shrink:0}

/* ==================== CONTENT ==================== */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(110px + var(--sb))}
.page{display:none;width:100%;max-width:720px;margin:0 auto;
  animation:fadeUp .32s cubic-bezier(.2,.8,.3,1)}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ==================== COMPONENTS ==================== */
.card{background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.card.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.05);
  border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);
  transition:all .18s;white-space:nowrap}
.chip.on{background:rgba(212,175,106,.14);border-color:rgba(212,175,106,.42);color:var(--a1)}
.chip:active{transform:scale(.95)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:54px;border-radius:16px;font-size:15px;font-weight:700;
  letter-spacing:.2px;transition:transform .12s,filter .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn-primary{background:linear-gradient(145deg,var(--a1),var(--a2) 55%,var(--a3));color:#1a1407;
  box-shadow:0 12px 28px -14px rgba(212,175,106,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-buy{background:linear-gradient(145deg,#22c55e,#15803d);color:#052e12;
  box-shadow:0 12px 28px -14px rgba(34,197,94,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-sell{background:linear-gradient(145deg,#ef4444,#b91c1c);color:#fff;
  box-shadow:0 12px 28px -14px rgba(239,68,68,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-ghost{background:rgba(255,255,255,.055);border:1px solid var(--bd);color:var(--tx)}
.field{margin:0 18px 12px}
.field-l{font-size:11px;color:var(--t2);letter-spacing:1.3px;text-transform:uppercase;
  font-weight:600;margin-bottom:8px;padding-left:2px}
.inp{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;
  background:rgba(255,255,255,.045);border:1px solid var(--bd);
  border-radius:var(--r2);transition:border-color .18s,background .18s}
.inp:focus-within{border-color:rgba(212,175,106,.55);background:rgba(212,175,106,.05)}
.inp input{flex:1;min-width:0;font-size:17px;font-weight:600;color:#fff}
.inp input::placeholder{color:var(--t3);font-weight:500}
.inp .suf{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.5px;flex-shrink:0}
.inp .pre{font-size:13px;font-weight:700;color:var(--t2);flex-shrink:0}
.sel{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;
  background:rgba(255,255,255,.045);border:1px solid var(--bd);border-radius:var(--r2)}
.sel select{flex:1;min-width:0;font-size:15px;font-weight:600;color:#fff;appearance:none;background:none}
.sel select option{background:#141822;color:#fff}
.sel svg{width:13px;height:13px;stroke:var(--t2);fill:none;stroke-width:2.2;flex-shrink:0;pointer-events:none}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.row.tap:active{background:rgba(255,255,255,.04)}
.row-ic{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  font-size:15px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--bd);overflow:hidden}
.row-ic.up{background:rgba(34,197,94,.11);border-color:rgba(34,197,94,.2);color:var(--up)}
.row-ic.dn{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.2);color:var(--dn)}
.row-ic.au{background:rgba(212,175,106,.13);border-color:rgba(212,175,106,.24);color:var(--a1)}
.row-ic img{width:100%;height:100%;object-fit:contain;padding:15%;box-sizing:border-box}
.row-main{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:11.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;flex-shrink:0}
.row-v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-x{font-size:11.5px;font-weight:700;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.au{color:var(--a1)}.info{color:var(--info)}
.sec-head{display:flex;align-items:center;justify-content:space-between;
  padding:22px 18px 10px;gap:10px}
.sec-t{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sec-l{font-size:12px;font-weight:600;color:var(--a2);cursor:pointer;padding:6px 0}
.panel{margin:0 18px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.empty{padding:44px 20px;text-align:center;color:var(--t3);font-size:13px;line-height:1.6}
.empty svg{width:34px;height:34px;stroke:var(--t3);fill:none;stroke-width:1.3;margin-bottom:12px;opacity:.55}
.hr{height:1px;background:var(--bd);margin:16px 0}
.filter{display:flex;gap:8px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.muted{color:var(--t2)}
.t3{color:var(--t3)}

/* ==================== HOME ==================== */
.hero{margin:0 18px;padding:22px 20px 20px;position:relative;overflow:hidden;
  border-radius:24px;
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(212,175,106,.14), transparent 55%),
    radial-gradient(90% 90% at 0% 100%, rgba(91,143,255,.10), transparent 60%),
    linear-gradient(160deg,#171b26,#0b0e16);
  border:1px solid rgba(212,175,106,.14)}
.hero-l{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t2);
  display:flex;align-items:center;gap:8px}
.hero-v{font-size:clamp(32px,10.5vw,42px);font-weight:800;letter-spacing:-1.6px;
  margin-top:8px;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#b8bdc9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-v.hid{letter-spacing:4px;-webkit-text-fill-color:var(--t2);background:none}
.hero-d{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:700}
.hero-spark{margin-top:14px;height:64px;position:relative}
.hero-spark svg{width:100%;height:100%;display:block;overflow:visible}
.hero-acts{display:flex;gap:8px;margin-top:16px}
.hero-act{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.045);
  border:1px solid var(--bd);transition:transform .15s,background .15s}
.hero-act:active{transform:scale(.94);background:rgba(255,255,255,.09)}
.hero-act svg{width:20px;height:20px;stroke:var(--a1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero-act span{font-size:10.5px;font-weight:600;color:#d5d9e4}

/* ==================== CHARTS ==================== */
.chart{position:relative}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y;cursor:crosshair}
.chart .crosshair{stroke:rgba(255,255,255,.4);stroke-width:1}
.chart .crossdot{fill:#fff;stroke:#0e1016;stroke-width:2}
.range-tabs{display:flex;padding:3px;gap:2px;border-radius:11px;
  background:rgba(255,255,255,.05);border:1px solid var(--bd)}
.range-tabs button{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--t2);transition:all .18s}
.range-tabs button.on{background:linear-gradient(145deg,var(--a1),var(--a2));color:#1a1407}
.range-tabs button.on[data-side="sell"]{background:linear-gradient(145deg,#ff8fa0,#e94b64);color:#fff}

/* ==================== ASSET ROW ==================== */
.asset{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;cursor:pointer;min-height:60px}
.asset:last-child{border-bottom:none}
.asset:active{background:rgba(255,255,255,.045)}
.asset-ic{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-weight:800;font-size:14px;color:var(--a1);position:relative;overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.asset-ic::before{content:attr(data-l)}
.asset-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--s2);padding:12%;box-sizing:border-box}
.asset-m{flex:1;min-width:0}
.asset-t{font-size:13.5px;font-weight:700;letter-spacing:-.1px}
.asset-s{font-size:11px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-r{text-align:right;flex-shrink:0}
.asset-p{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.asset-c{font-size:11px;font-weight:700;margin-top:2px}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{background:rgba(34,197,94,.14);color:var(--up)}
.pill.dn{background:rgba(239,68,68,.14);color:var(--dn)}

/* ==================== NAV ==================== */
.nav-wrap{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(10px + var(--sb));
  pointer-events:none;z-index:20}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  height:66px;padding:6px;border-radius:22px;
  background:rgba(14,16,22,.88);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--bd2);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.95);
  pointer-events:auto;max-width:520px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:16px;color:var(--t3);transition:all .2s}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.nav-item span{font-size:9.5px;font-weight:700;letter-spacing:.1px}
.nav-item.on{color:var(--a1);background:rgba(212,175,106,.12)}
.nav-item.on svg{stroke:var(--a1);filter:drop-shadow(0 0 6px rgba(212,175,106,.5))}

/* ==================== SHEET ==================== */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#141822,#0b0e16);
  border-radius:26px 26px 0 0;border-top:1px solid var(--bd2);
  padding:10px 0 calc(22px + var(--sb));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.25,1,.4,1)}
.overlay.on .sheet{transform:none}
.sh-handle{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 14px}
.sh-t{font-size:18px;font-weight:700;letter-spacing:-.3px}
.sh-close{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07)}
.sh-close svg{width:15px;height:15px;stroke:var(--t2);fill:none;stroke-width:2.2;stroke-linecap:round}
@media (min-width:720px){
  .overlay{align-items:center;justify-content:center;padding:24px}
  .sheet{max-width:480px;border-radius:26px;border:1px solid var(--bd2);padding-bottom:24px;max-height:min(88dvh,780px)}
}

/* ==================== TOAST ==================== */
#toast{position:fixed;left:50%;top:calc(16px + var(--st));transform:translate(-50%,-140%);
  background:rgba(20,24,34,.96);backdrop-filter:blur(20px);
  border:1px solid var(--bd2);border-radius:15px;padding:12px 18px;
  font-size:13px;font-weight:600;z-index:200;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:9px;transition:transform .38s cubic-bezier(.2,1.2,.4,1);
  box-shadow:0 20px 44px -20px rgba(0,0,0,1);text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#052e12;background:var(--up);flex-shrink:0}
#toast.err .dot{background:var(--dn);color:#fff}
#toast.err{border-color:rgba(239,68,68,.35)}
#toast.ok .dot::before{content:"✓"}
#toast.err .dot::before{content:"!"}

/* ==================== STATES ==================== */
.loader{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--a2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{display:inline-block;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
  background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:6px}
@keyframes shim{to{background-position:-200% 0}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}

/* ==================== CALC ==================== */
.calc-d{margin:4px 18px 14px;padding:20px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--bd);font-size:clamp(26px,8vw,34px);font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums;min-height:78px;display:flex;align-items:center;justify-content:flex-end;
  overflow-x:auto;white-space:nowrap}
.calc-k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px}
.calc-k button{height:58px;border-radius:14px;font-size:21px;font-weight:600;

<script>
/* =============================================================
   SAYFER · финансовое приложение с торговым терминалом
   ============================================================= */

/* ---------- Telegram ---------- */
const TG = window.Telegram?.WebApp;
if (TG){ TG.ready(); TG.expand(); try { TG.setHeaderColor('#07080c'); TG.setBackgroundColor('#07080c'); TG.disableVerticalSwipes?.(); } catch(e){} }
try { TG?.BackButton?.hide(); } catch(e){}
let HAPTICS = true;
const haptic = (t='light') => { if (!HAPTICS) return; try { TG?.HapticFeedback?.impactOccurred(t); } catch(e){} };
const hapticOk = () => { if (!HAPTICS) return; try { TG?.HapticFeedback?.notificationOccurred('success'); } catch(e){} };
const hapticErr = () => { if (!HAPTICS) return; try { TG?.HapticFeedback?.notificationOccurred('error'); } catch(e){} };

/* ---------- Утилиты ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => typeof structuredClone === 'function' ? structuredClone(o) :
  JSON.parse(JSON.stringify(o, (k,v) => typeof v === 'bigint' ? {__b:v.toString()} : v), (k,v) => v && v.__b ? BigInt(v.__b) : v);

/* ---------- BigInt-математика (SCB = 10^8) ---------- */
const SCB = 100000000n;
const pow10 = d => 10n ** BigInt(8 - d);
function parseAmt(v, d=8){
  const s = String(v ?? '').replace(/[\s\u00A0\u202F]/g, '');
  const m = /^(\d*)(?:[.,](\d*))?/.exec(s);
  const ip = (m && m[1]) || '0', fp = ((m && m[2]) || '').slice(0, d).padEnd(8, '0');
  return BigInt(ip) * SCB + BigInt(fp);
}
function toB(v){
  if (typeof v === 'bigint') return v;
  if (typeof v === 'number'){
    if (!isFinite(v)) return 0n;
    const neg = v < 0; v = Math.abs(v);
    const r = parseAmt(v.toFixed(8), 8);
    return neg ? -r : r;
  }
  return parseAmt(v, 8);
}
const truncB = (b,d) => { const p = pow10(d); return b - b % p; };
const roundB = (b,d) => { const p = pow10(d), h = p/2n; return b >= 0n ? (b+h)/p*p : -((-b+h)/p*p); };
const absB = b => b < 0n ? -b : b;
const dStr = b => { const n = b < 0n; if (n) b = -b;
  const f = (b % SCB).toString().padStart(8,'0').replace(/0+$/,'');
  return (n?'-':'') + (b/SCB).toString() + (f ? '.'+f : ''); };
function ratioOf(x){
  const dv = new DataView(new ArrayBuffer(8)); dv.setFloat64(0, x);
  const hi = dv.getUint32(0), lo = dv.getUint32(4), e = (hi>>>20)&0x7ff;
  let m = (BigInt(hi&0xfffff)<<32n)|BigInt(lo), exp;
  if (e === 0) exp = -1074; else { m |= 1n<<52n; exp = e - 1075; }
  return exp >= 0 ? [m<<BigInt(exp), 1n] : [m, 1n<<BigInt(-exp)];
}
function mulNum(b, x){
  if (!(x > 0) || !isFinite(x)) return 0n;
  const [n,d] = ratioOf(x);
  return (b * n * 2n + d) / (d * 2n);
}
function groupInt(s){
  const r = s.length % 3; let o = s.slice(0, r);
  for (let i = r; i < s.length; i += 3) o += (o ? ' ' : '') + s.slice(i, i+3);
  return o;
}
function splitB(b, minD, maxD){
  b = roundB(b, maxD); const neg = b < 0n; if (neg) b = -b;
  let f = (b % SCB).toString().padStart(8,'0').slice(0, maxD);
  while (f.length > minD && f.endsWith('0')) f = f.slice(0,-1);
  return {neg, i: (b/SCB).toString(), f};
}
function formatAmountInput(str){
  if (str == null) return '';
  let s = String(str).replace(/[\s\u00A0\u202F]/g, '');
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);
  s = s.replace(/,/g,'.').replace(/[^\d.]/g,'');
  const firstDot = s.indexOf('.');
  if (firstDot >= 0) s = s.slice(0, firstDot+1) + s.slice(firstDot+1).replace(/\./g,'');
  const dot = s.indexOf('.');
  let ip = dot < 0 ? s : s.slice(0, dot);
  const fp = dot < 0 ? '' : s.slice(dot);
  ip = ip.replace(/^0+(?=\d)/, '');
  if (ip.length > 30) ip = ip.slice(0,30);
  if (!ip && !fp) return neg ? '-' : '';
  return (neg?'-':'') + groupInt(ip) + fp;
}

/* ---------- Форматирование ---------- */
let fmtFmt = 'full';
function curSymbol(code){
  try {
    const p = new Intl.NumberFormat('en-US',{style:'currency',currency:code,currencyDisplay:'narrowSymbol'}).formatToParts(0);
    const v = p.find(x => x.type === 'currency')?.value || code;
    return v.length > 3 ? code : v;
  } catch(e){ return code; }
}
function curName(code){
  try { return new Intl.DisplayNames(['en'],{type:'currency'}).of(code) || code; } catch(e){ return code; }
}
function fmtMoneyB(b, cur, min=2, max=2){
  const {neg,i,f} = splitB(b, min, max);
  let parts = null;
  try { parts = new Intl.NumberFormat('en-US',{style:'currency',currency:cur,currencyDisplay:'narrowSymbol',minimumFractionDigits:min,maximumFractionDigits:max}).formatToParts(0); } catch(e){}
  if (!parts) return (neg?'-':'') + groupInt(i) + (f?'.'+f:'') + ' ' + cur;
  let out = '';
  for (const p of parts){
    if (p.type === 'integer') out += groupInt(i);
    else if (p.type === 'fraction') out += f;
    else if (p.type === 'decimal') { if (f) out += '.'; }
    else if (p.type !== 'group') out += p.value;
  }
  return (neg?'-':'') + out;
}
function fmtNum(n, dec=2){
  if (!isFinite(n)) return '—';
  return new Intl.NumberFormat('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n);
}
function fmtQty(n, maxD){
  if (typeof n !== 'bigint') n = toB(n);
  const a = absB(n);
  let d = maxD;
  if (d == null) d = a >= 1000n*SCB ? 2 : a >= SCB ? 4 : 8;
  const {neg,i,f} = splitB(n, 0, d);
  return (neg?'-':'') + groupInt(i) + (f ? '.'+f : '');
}
function flag(cur){
  try {
    const rn = new Intl.DisplayNames(['en'],{type:'region'});
    const cc = cur === 'EUR' ? 'EU' : cur.slice(0,2);
    if (rn.of(cc) === cc) return '🌐';
    return String.fromCodePoint(...[...cc].map(c => 127397 + c.charCodeAt(0)));
  } catch(e){ return '🌐'; }
}

/* =============================================================
   MARKET — рыночные данные (крипта: CoinGecko, акции: Yahoo)
   ============================================================= */
const Market = {
  fiat: null,
  crypto: {},
  stocks: {},
  _fiatP: null,
  _cryptoP: null,
  _stocksP: null,
  _stkCache: {},

  async loadFiat(force){
    if (this.fiat && !force) return;
    if (this._fiatP) return this._fiatP;
    this._fiatP = (async () => {
      try {
        const r = await fetch('https://open.er-api.com/v6/latest/USD');
        const d = await r.json();
        if (d?.rates) this.fiat = { ...d.rates, USD: 1 };
      } catch(e){}
      if (!this.fiat) this.fiat = { USD:1, EUR:.92, GBP:.79, RUB:92, UAH:41, PLN:4, CHF:.88, JPY:150, CNY:7.2 };
    })().finally(() => this._fiatP = null);
    return this._fiatP;
  },

  async loadCrypto(force){
    if (Object.keys(this.crypto).length && !force) return;
    if (this._cryptoP) return this._cryptoP;
    const clean = v => String(v ?? '').replace(/[<>&"'`]/g,'');
    this._cryptoP = (async () => {
      try {
        const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h');
        const d = await r.json();
        if (Array.isArray(d) && d.length){
          const map = {};
          for (const c of d){
            if (!c?.id || !(c.current_price > 0)) continue;
            map[c.id] = {
              id: c.id, sym: clean(c.symbol).toUpperCase(), name: clean(c.name),
              price: c.current_price, chg24: c.price_change_percentage_24h || 0,
              image: /^https:\/\//.test(c.image||'') ? c.image : '',
              cls: 'crypto', mcap: c.market_cap || 0, vol: c.total_volume || 0
            };
          }
          this.crypto = map;
        }
      } catch(e){ console.warn('crypto load', e); }
      if (!Object.keys(this.crypto).length) this.crypto = FALLBACK_CRYPTO();
    })().finally(() => this._cryptoP = null);
    return this._cryptoP;
  },

  async loadStocks(force){
    if (this._stocksP && !force) return this._stocksP;
    this._stocksP = (async () => {
      const syms = [...new Set([...STOCK_LIST, ...Object.keys(DB.positions).filter(s => s.startsWith('stk:'))])];
      let i = 0;
      const w = async () => {
        while (i < syms.length){
          const s = syms[i++];
          try { await this.quote(s, force); } catch(e){ this.stocks[s] = this.stocks[s] || { sym:s, err:1 }; }
        }
      };
      await Promise.all([w(),w(),w()]);
    })().finally(() => this._stocksP = null);
    return this._stocksP;
  },

  async quote(sym, force){
    sym = String(sym).toUpperCase().trim();
    if (!/^[A-Z0-9.\-^=]{1,15}$/.test(sym)) throw new Error('bad');
    const c = this.stocks[sym];
    if (c && !c.err && !force && Date.now() - c.at < 30000) return c;
    const u = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=5m`;
    const tries = [u, 'https://corsproxy.io/?' + encodeURIComponent(u), 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)];
    let d, err;
    for (const t of tries){
      try { const r = await fetch(t); if (!r.ok) throw new Error(r.status); d = await r.json(); break; }
      catch(e){ err = e; }
    }
    if (!d) throw err || new Error('net');
    const m = d?.chart?.result?.[0]?.meta;
    if (!m || !(m.regularMarketPrice > 0)) throw new Error('no');
    const [price, cur] = normPrice(m.regularMarketPrice, m.currency || 'USD');
    const pr = m.chartPreviousClose ?? m.previousClose;
    const prev = pr > 0 ? normPrice(pr, m.currency || 'USD')[0] : price;
    const q = {
      sym, name: String(m.longName || m.shortName || sym), cur, price, prev,
      exch: String(m.fullExchangeName || m.exchangeName || ''),
      image: LOGO_MAP[sym] ? '' : '', cls: 'stock',
      chg24: prev > 0 ? (price/prev - 1) * 100 : 0,
      at: Date.now(), t: (m.regularMarketTime||0)*1000
    };
    this.stocks[sym] = q;
    return q;
  },

  get(id){
    if (!id) return null;
    const [cls, key] = id.includes(':') ? id.split(':') : ['crypto', id];
    if (cls === 'crypto') return this.crypto[key] || null;
    if (cls === 'stock') return this.stocks[key] || null;
    return null;
  },

  priceUSD(id){
    const a = this.get(id);
    if (!a || !(a.price > 0)) return 0;
    if (a.cls === 'crypto') return a.price;
    if (a.cls === 'stock'){
      const r = this.fiat?.[a.cur];
      return r > 0 ? a.price / r : 0;
    }
    return 0;
  },

  toUSD(amountBig, cur){
    if (!this.fiat) return amountBig;
    const r = this.fiat[cur] || 1;
    return mulNum(amountBig, 1/r);
  },
  fromUSD(usdBig, cur){
    if (!this.fiat) return usdBig;
    const r = this.fiat[cur] || 1;
    return mulNum(usdBig, r);
  }
};
function normPrice(p, cur){
  if (['GBp','GBX'].includes(cur)) return [p/100, 'GBP'];
  if (cur === 'ILA') return [p/100, 'ILS'];
  if (['ZAc','ZAC'].includes(cur)) return [p/100, 'ZAR'];
  return [p, cur];
}

/* =============================================================
   PORTFOLIO — расчёт стоимости, PnL
   ============================================================= */
const Portfolio = {
  positionsList(){
    const out = [];
    for (const [key, p] of Object.entries(DB.positions)){
      if (!(p.qty > 0n)) continue;
      const priceUSD = Market.priceUSD(key);
      const valueUSD = priceUSD > 0 ? mulNum(p.qty, priceUSD) : 0n;
      const pl = valueUSD - p.cost;
      const pct = p.cost > 0n ? Number(pl) / Number(p.cost) * 100 : 0;
      const avgUSD = p.qty > 0n ? p.cost / p.qty : 0n;
      out.push({ key, ...p, priceUSD, valueUSD, pl, pct, avgUSD });
    }
    out.sort((a, b) => Number(b.valueUSD - a.valueUSD));
    return out;
  },
  cashUSD(){
    let sum = 0n;
    for (const [cur, amt] of Object.entries(DB.balances)){
      if (amt) sum += Market.toUSD(amt, cur);
    }
    for (const [cur, amt] of Object.entries(DB.reserved)){
      if (amt) sum += Market.toUSD(amt, cur);
    }
    return sum;
  },
  freeUSD(){
    let sum = 0n;
    for (const [cur, amt] of Object.entries(DB.balances)){
      if (amt) sum += Market.toUSD(amt, cur);
    }
    return sum;
  },
  reservedUSD(){
    let sum = 0n;
    for (const [cur, amt] of Object.entries(DB.reserved)){
      if (amt) sum += Market.toUSD(amt, cur);
    }
    return sum;
  },
  totalUSD(){
    let sum = this.freeUSD() + this.reservedUSD();
    for (const p of this.positionsList()) sum += p.valueUSD;
    return sum;
  },
  costUSD(){
    let sum = 0n;
    for (const p of this.positionsList()) sum += p.cost;
    return sum;
  },
  pnlUSD(){
    let sum = 0n;
    for (const p of this.positionsList()) sum += p.pl;
    return sum;
  }
};

/* =============================================================
   ORDERS — торговый движок
   ============================================================= */
const Orders = {
  FEE_PCT: 0.001,  // 0.1% комиссия биржи

  fee(amountUSD){ return roundB(mulNum(amountUSD, this.FEE_PCT), 2); },

  openOrders(){
    return DB.orders.filter(o => o.status === 'pending' || o.status === 'partially_filled');
  },

  place({ assetId, side, type, qty, limitPriceUSD }){
    const a = Market.get(assetId);
    if (!a) throw new Error('Актив не найден');
    if (!(qty > 0n)) throw new Error('Введите количество');

    const cur = DB.displayCurrency;
    const marketPriceUSD = Market.priceUSD(assetId);
    if (!(marketPriceUSD > 0)) throw new Error('Котировка недоступна');

    if (type === 'market'){
      return this._fillMarket({ a, side, qty, marketPriceUSD, cur });
    }
    if (type === 'limit'){
      if (!(limitPriceUSD > 0)) throw new Error('Введите цену');
      return this._placeLimit({ a, side, qty, limitPriceUSD, cur });
    }
    throw new Error('Неизвестный тип ордера');
  },

  _fillMarket({ a, side, qty, marketPriceUSD, cur }){
    const totalUSD = roundB(mulNum(qty, marketPriceUSD), 2);
    const feeUSD = this.fee(totalUSD);

    if (side === 'buy'){
      const totalCur = Market.fromUSD(totalUSD + feeUSD, cur);
      const bal = DB.balances[cur] || 0n;
      if (totalCur > bal) throw new Error('Недостаточно средств');
      DB.balances[cur] = bal - totalCur;
      if (DB.balances[cur] <= 0n) delete DB.balances[cur];

      const pos = DB.positions[a.id] || { qty: 0n, cost: 0n, sym: a.sym, name: a.name, cls: a.cls };
      pos.qty += qty;
      pos.cost += totalUSD + feeUSD;
      DB.positions[a.id] = pos;
    } else {
      const pos = DB.positions[a.id];
      if (!pos || qty > pos.qty) throw new Error('Недостаточно актива');

      const removedCost = qty === pos.qty ? pos.cost : (pos.cost * qty) / pos.qty;
      const proceedsUSD = totalUSD - feeUSD;
      const realizedUSD = proceedsUSD - removedCost;

      pos.qty -= qty;
      pos.cost -= removedCost;
      if (pos.qty <= 0n) delete DB.positions[a.id];

      const addCur = Market.fromUSD(proceedsUSD, cur);
      DB.balances[cur] = (DB.balances[cur] || 0n) + addCur;
      this._logTrade(a, side, qty, marketPriceUSD, realizedUSD);
    }
    const order = {
      id: uid(), assetId: a.id, sym: a.sym, name: a.name, side, type: 'market',
      qty: dStr(qty), priceUSD: marketPriceUSD, status: 'filled',
      createdAt: Date.now(), filledAt: Date.now(), fee: dStr(feeUSD),
      totalUSD: dStr(totalUSD), cur
    };
    DB.orders.unshift(order);
    if (DB.orders.length > 200) DB.orders.length = 200;
    this._logTx(a, side, qty, totalUSD, feeUSD, cur);
    save();
    return order;
  },

  _placeLimit({ a, side, qty, limitPriceUSD, cur }){
    const totalUSD = roundB(mulNum(qty, limitPriceUSD), 2);
    const feeUSD = this.fee(totalUSD);

    if (side === 'buy'){
      const needCur = Market.fromUSD(totalUSD + feeUSD, cur);
      const bal = DB.balances[cur] || 0n;
      if (needCur > bal) throw new Error('Недостаточно средств для резерва');
      DB.balances[cur] = bal - needCur;
      if (DB.balances[cur] <= 0n) delete DB.balances[cur];
      DB.reserved[cur] = (DB.reserved[cur] || 0n) + needCur;
    } else {
      const pos = DB.positions[a.id];
      if (!pos || qty > pos.qty) throw new Error('Недостаточно актива');
      pos.qty -= qty;
      if (pos.qty === 0n) delete DB.positions[a.id];
      const reserved = DB.positions['reserved:' + a.id] || { qty: 0n, cost: 0n, sym: a.sym, name: a.name, cls: a.cls };
      reserved.qty += qty;
      DB.positions['reserved:' + a.id] = reserved;
    }

    const order = {
      id: uid(), assetId: a.id, sym: a.sym, name: a.name, side, type: 'limit',
      qty: dStr(qty), priceUSD: limitPriceUSD, status: 'pending',
      createdAt: Date.now(), fee: dStr(feeUSD), totalUSD: dStr(totalUSD), cur
    };
    DB.orders.unshift(order);
    save();
    return order;
  },

  cancel(orderId){
    const o = DB.orders.find(x => x.id === orderId);
    if (!o || o.status !== 'pending') return false;
    const cur = o.cur;
    const qty = parseAmt(o.qty, 8);
    const totalUSD = toB(o.totalUSD);
    const feeUSD = toB(o.fee);

    if (o.side === 'buy'){
      const un = Market.fromUSD(totalUSD + feeUSD, cur);
      const r = DB.reserved[cur] || 0n;
      const take = un > r ? r : un;
      DB.reserved[cur] = r - take;
      if (DB.reserved[cur] <= 0n) delete DB.reserved[cur];
      DB.balances[cur] = (DB.balances[cur] || 0n) + take;
    } else {
      const key = 'reserved:' + o.assetId;
      const pos = DB.positions[key];
      if (pos){
        const back = DB.positions[o.assetId] || { qty: 0n, cost: 0n, sym: pos.sym, name: pos.name, cls: pos.cls };
        back.qty += qty;
        DB.positions[o.assetId] = back;
        pos.qty -= qty;
        if (pos.qty <= 0n) delete DB.positions[key];
      }
    }
    o.status = 'cancelled';
    o.cancelledAt = Date.now();
    save();
    return true;
  },

  async tick(){
    const open = this.openOrders();
    if (!open.length) return;
    let changed = false;
    for (const o of open){
      try {
        const a = Market.get(o.assetId);
        if (!a) continue;
        const px = Market.priceUSD(o.assetId);
        if (!(px > 0)) continue;
        const limit = o.priceUSD;
        const shouldFill = o.side === 'buy' ? px <= limit : px >= limit;
        if (!shouldFill) continue;
        this._fillLimit(o, a, px);
        changed = true;
      } catch(e){ console.warn('tick', e); }
    }
    if (changed){ save(); if (App.current === 'portfolio' || App.current === 'home') App.render(); }
  },

  _fillLimit(o, a, px){
    const cur = o.cur;
    const qty = parseAmt(o.qty, 8);
    const totalUSD = roundB(mulNum(qty, px), 2);
    const feeUSD = this.fee(totalUSD);
    const reservedTotalUSD = toB(o.totalUSD);
    const reservedFee = toB(o.fee);

    if (o.side === 'buy'){
      const un = Market.fromUSD(reservedTotalUSD + reservedFee, cur);
      const r = DB.reserved[cur] || 0n;
      const take = un > r ? r : un;
      DB.reserved[cur] = r - take;
      if (DB.reserved[cur] <= 0n) delete DB.reserved[cur];
      const change = un > take ? un - take : 0n;
      if (change) DB.balances[cur] = (DB.balances[cur] || 0n) + change;

      const pos = DB.positions[a.id] || { qty: 0n, cost: 0n, sym: a.sym, name: a.name, cls: a.cls };
      pos.qty += qty;
      pos.cost += totalUSD + feeUSD;
      DB.positions[a.id] = pos;
    } else {
      const key = 'reserved:' + a.id;
      const res = DB.positions[key];
      if (res){ res.qty -= qty; if (res.qty <= 0n) delete DB.positions[key]; }
      const proceedsUSD = totalUSD - feeUSD;
      const addCur = Market.fromUSD(proceedsUSD, cur);
      DB.balances[cur] = (DB.balances[cur] || 0n) + addCur;
    }
    o.status = 'filled';
    o.filledAt = Date.now();
    o.priceUSD = px;
    this._logTx(a, o.side, qty, totalUSD, feeUSD, cur);
  },

  _logTrade(a, side, qty, px, realizedUSD){
    DB.txs.unshift({
      id: uid(), type: 'stock', title: (side === 'buy' ? 'Покупка ' : 'Продажа ') + a.sym,
      subtitle: `${fmtQty(qty)} × ${fmtNum(px)} USD` + (side === 'sell' ? ` · P&L ${fmtNum(Number(realizedUSD)/1e8, 2)}` : ''),
      amountText: (side === 'buy' ? '-' : '+') + fmtMoneyB(Market.fromUSD(roundB(mulNum(qty, px), 2), DB.displayCurrency), DB.displayCurrency),
      amountClass: side === 'buy' ? 'neg' : 'pos',
      date: new Date().toISOString(), sym: a.sym
    });
    if (DB.txs.length > 500) DB.txs.length = 500;
  },

  _logTx(a, side, qty, totalUSD, feeUSD, cur){

/* =============================================================
   CHART — SVG-график с кроссхейром
   ============================================================= */
const Chart = {
  cache: {},
  async hist(assetId, range){
    const key = assetId + ':' + range;
    if (this.cache[key] && Date.now() - this.cache[key].at < 60000) return this.cache[key].pts;
    const a = Market.get(assetId);
    if (!a) return [];
    let pts = [];
    if (a.cls === 'crypto'){
      try {
        const days = { '1D':1, '1W':7, '1M':30, '1Y':365 }[range] || 1;
        const r = await fetch(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(a.id)}/market_chart?vs_currency=usd&days=${days}`);
        const d = await r.json();
        pts = (d?.prices || []).map(p => p[1]).filter(x => x > 0);
      } catch(e){}
    } else {
      const iv = { '1D':['1d','5m'], '1W':['5d','30m'], '1M':['1mo','1d'], '1Y':['1y','1wk'] }[range] || ['1d','5m'];
      const u = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(a.sym)}?range=${iv[0]}&interval=${iv[1]}`;
      const tries = [u, 'https://corsproxy.io/?' + encodeURIComponent(u), 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)];
      for (const t of tries){
        try {
          const r = await fetch(t); if (!r.ok) continue;
          const d = await r.json();
          const cl = d?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
          pts = cl.filter(x => typeof x === 'number' && x > 0);
          break;
        } catch(e){}
      }
    }
    if (!pts.length){
      // синтетика для демонстрации если сеть недоступна
      const base = Market.priceUSD(assetId) || 100;
      let v = base; const n = 60;
      for (let i = 0; i < n; i++){ v = v * (1 + (Math.random()-0.485) * 0.02); pts.push(v); }
    }
    this.cache[key] = { at: Date.now(), pts };
    return pts;
  },

  render(el, pts, opts={}){
    if (!el) return;
    if (pts.length < 2){ el.innerHTML = '<div class="empty" style="padding:24px">Нет данных</div>'; return; }
    const W = 340, H = opts.h || 200, P = 10;
    const mn = Math.min(...pts), mx = Math.max(...pts), sp = (mx-mn) || 1;
    const X = i => i / (pts.length-1) * W;
    const Y = v => H - P - (v - mn) / sp * (H - 2*P);
    const path = pts.map((v,i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const up = pts[pts.length-1] >= pts[0];
    const col = up ? '#22c55e' : '#ef4444';
    const base = Y(pts[0]).toFixed(1);
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-n="${pts.length}">
      <defs>
        <linearGradient id="g_${Math.random().toString(36).slice(2,6)}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${col}" stop-opacity=".34"/>
          <stop offset="1" stop-color="${col}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 5"/>
      <polygon points="0,${H} ${path} ${W},${H}" fill="${col}" fill-opacity=".1"/>
      <polyline points="${path}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1]).toFixed(1)}" r="4" fill="${col}"/>
      <g class="scrub" style="display:none">
        <line class="crosshair" y1="0" y2="${H}"/>
        <circle class="crossdot" r="5"/>
      </g>
    </svg>`;
    // прицел
    const svg = el.querySelector('svg');
    const scrub = svg.querySelector('.scrub');
    const line = scrub.querySelector('.crosshair');
    const dot = scrub.querySelector('.crossdot');
    let on = false;
    const move = e => {
      const r = svg.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const t = Math.min(1, Math.max(0, (cx - r.left) / (r.width || 1)));
      const i = Math.round(t * (pts.length - 1));
      const x = i / (pts.length - 1) * W;
      const y = H - P - (pts[i] - mn) / sp * (H - 2*P);
      scrub.style.display = '';
      line.setAttribute('x1', x); line.setAttribute('x2', x);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    };
    const stop = () => { scrub.style.display = 'none'; on = false; };
    svg.addEventListener('pointerdown', e => { on = true; try { svg.setPointerCapture(e.pointerId); } catch(_){} haptic('light'); move(e); });
    svg.addEventListener('pointermove', e => { if (on) move(e); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev => svg.addEventListener(ev, stop));
  }
};

/* Калькулятор */
const calc = { d: '0', acc: null, op: null, eq: false, fresh: false, err: false };
function calcReset(){ calc.d = '0'; calc.acc = null; calc.op = null; calc.eq = false; calc.fresh = false; calc.err = false; }
function calcParse(s){ if (!s || s === 'Error') return 0n;
  const n = s.startsWith('-'); const b = parseAmt(n ? s.slice(1) : s, 8);
  return n ? -b : b; }
function calcApply(a,b,op){
  try {
    if (op === '+') return a+b;
    if (op === '-') return a-b;
    if (op === '×'){ const p = a*b; return p >= 0n ? (p + SCB/2n)/SCB : -((-p + SCB/2n)/SCB); }
    if (op === '÷'){ if (b === 0n) return null; const n = a*SCB; return n >= 0n ? (n + b/2n)/b : -((-n + b/2n)/b); }
  } catch(e){ return null; }
  return null;
}
function calcToStr(b){ const neg = b < 0n; if (neg) b = -b;
  const i = (b/SCB).toString(); let f = (b%SCB).toString().padStart(8,'0');
  while (f.length > 1 && f.endsWith('0')) f = f.slice(0,-1);
  if (f === '0') f = '';
  return (neg?'-':'') + i + (f ? '.'+f : ''); }
function renderCalc(){
  const el = $('#calcD'); if (!el) return;
  if (calc.err){ el.textContent = 'Error'; return; }
  const s = calc.d, neg = s.startsWith('-');
  const b = neg ? s.slice(1) : s;
  const d = b.indexOf('.'); const ip = d < 0 ? b : b.slice(0, d); const fp = d < 0 ? '' : b.slice(d);
  el.textContent = (neg?'-':'') + groupInt(ip || '0') + fp;
}
function calcInput(x){
  if (calc.err) calcReset();
  if (calc.eq){ calc.d = '0'; calc.eq = false; calc.acc = null; }
  if (calc.fresh){ calc.d = '0'; calc.fresh = false; }
  const dt = calc.d.indexOf('.');
  if (dt >= 0 && calc.d.length - dt - 1 >= 8) return;
  if (calc.d === '0') calc.d = x;
  else if (calc.d === '-0') calc.d = '-' + x;
  else calc.d += x;
  renderCalc();
}
function calcDot(){
  if (calc.err) calcReset();
  if (calc.eq){ calc.d = '0'; calc.eq = false; calc.acc = null; }
  if (calc.fresh){ calc.d = '0'; calc.fresh = false; }
  if (!calc.d.includes('.')) calc.d += '.';
  renderCalc();
}
function calcBack(){
  if (calc.err){ calcReset(); return renderCalc(); }
  if (calc.eq || calc.fresh) return;
  calc.d = calc.d.slice(0,-1);
  if (!calc.d || calc.d === '-') calc.d = '0';
  renderCalc();
}
function calcSetOp(op){
  if (calc.err) calcReset();
  if (calc.fresh && calc.op && calc.acc !== null){ calc.op = op; return; }
  const cur = calcParse(calc.d);
  if (calc.acc === null) calc.acc = cur;
  else if (calc.op){ const r = calcApply(calc.acc, cur, calc.op);
    if (r === null){ calc.err = true; calc.d = 'Error'; renderCalc(); return; }
    calc.acc = r;
  } else calc.acc = cur;
  calc.op = op; calc.eq = false; calc.fresh = true;
  calc.d = calcToStr(calc.acc);
  renderCalc();
}
function calcEq(){
  if (calc.err){ calcReset(); return renderCalc(); }
  if (!calc.op || calc.acc === null) return;
  const cur = calcParse(calc.d);
  const r = calcApply(calc.acc, cur, calc.op);
  if (r === null){ calc.err = true; calc.d = 'Error'; renderCalc(); return; }
  calc.d = calcToStr(r); calc.acc = r; calc.op = null; calc.eq = true; calc.fresh = false;
  renderCalc();
}
function openCalc(){
  calcReset();
  openSheet(`
    <div class="sh-handle"></div>
    <div class="sh-head"><div class="sh-t">Калькулятор</div><button class="sh-close" data-close><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="calc-d num" id="calcD">0</div>
    <div class="calc-k">
      <button class="fn" data-c="clr">C</button>
      <button class="fn" data-c="bk"><svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
      <button class="op" data-c="op" data-op="÷">÷</button>
      <button class="op" data-c="op" data-op="×">×</button>
      <button data-c="n" data-x="7">7</button><button data-c="n" data-x="8">8</button><button data-c="n" data-x="9">9</button>
      <button class="op" data-c="op" data-op="-">−</button>
      <button data-c="n" data-x="4">4</button><button data-c="n" data-x="5">5</button><button data-c="n" data-x="6">6</button>
      <button class="op" data-c="op" data-op="+">+</button>
      <button data-c="n" data-x="1">1</button><button data-c="n" data-x="2">2</button><button data-c="n" data-x="3">3</button>
      <button class="eq" data-c="eq" style="grid-row:span 2">=</button>
      <button data-c="n" data-x="0" style="grid-column:span 2">0</button>
      <button data-c="dot">.</button>
    </div><div style="height:8px"></div>`);
  $$('#sh .calc-k button').forEach(b => b.addEventListener('click', () => {
    haptic('light');
    const c = b.dataset.c;
    if (c === 'n') calcInput(b.dataset.x);
    else if (c === 'dot') calcDot();
    else if (c === 'op') calcSetOp(b.dataset.op);
    else if (c === 'eq') calcEq();
    else if (c === 'clr'){ calcReset(); renderCalc(); }
    else if (c === 'bk') calcBack();
  }));
  renderCalc();
}

        <button class="icon-btn" id="watchBtn" aria-label="Избранное"><svg viewBox="0 0 24 24" style="stroke:var(--a1)"><polygon points="12 2 15 9 22 9 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9 9 9"/></svg></button>
      </div>
      <div class="td-price">
        <div class="td-price-v">${priceUSD > 0 ? fmtMoneyB(price, cur, price < 1 ? 4 : 2, price < 1 ? 4 : 2) : '—'}</div>
        <div class="td-price-s">${up?'+':''}${chg.toFixed(2)}% · ${fmtNum(a.price, a.price < 1 ? 4 : 2)} ${esc(a.cur || 'USD')} · ${a.at ? new Date(a.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
      </div>
      <div class="td-chart"><div id="tChart"></div></div>
      <div style="padding:0 18px;margin-top:12px"><div class="range-tabs" id="tRange">
        <button data-r="1D">1Д</button><button data-r="1W">1Н</button><button class="on" data-r="1M">1М</button><button data-r="1Y">1Г</button>
      </div></div>

      <div class="td-tabs" id="tSide">
        <button class="${isBuy?'on':''}" data-side="buy">Покупка</button>
        <button class="${!isBuy?'on':''}" data-side="sell">Продажа</button>
      </div>
      <div class="td-type" id="tType">
        <button data-type="market" class="${this.tradeType==='market'?'on':''}">Рыночный</button>
        <button data-type="limit" class="${this.tradeType==='limit'?'on':''}">Лимитный</button>
      </div>

      <div class="field" style="margin-top:14px">
        <div class="field-l" id="qtyLbl">Количество</div>
        <div class="inp"><input id="tQty" type="text" inputmode="decimal" placeholder="0" value="">
          <div class="suf">${esc(a.sym || '')}</div></div>
        <div class="td-quick" id="tQuick"></div>
      </div>
      <div class="field" id="limitWrap" style="${this.tradeType==='market'?'display:none':''}">
        <div class="field-l">Лимитная цена</div>
        <div class="inp"><input id="tLimit" type="text" inputmode="decimal" placeholder="${fmtNum(a.price)}">
          <div class="suf">${esc(a.cur || 'USD')}</div></div>
      </div>

      <div class="td-rows">
        <div class="td-row"><span>Цена за единицу</span><b id="tPrice">—</b></div>
        <div class="td-row"><span>Стоимость</span><b id="tTotal">—</b></div>
        <div class="td-row"><span>Комиссия биржи (0.1%)</span><b id="tFee">—</b></div>
        <div class="td-row"><span>${isBuy?'Спишется':'Получите'}</span><b id="tPay">—</b></div>
        <div class="td-row"><span>Доступно</span><b id="tAvail">—</b></div>
        ${!isBuy ? `<div class="td-row"><span>В портфеле</span><b>${posText}</b></div>` : ''}
      </div>

      <div class="td-foot">
        <button class="btn ${isBuy?'btn-buy':'btn-sell'}" id="tGo">${isBuy?'Купить':'Продать'}</button>
      </div>
      <div style="height:20px"></div>`;

    // График
    const chartEl = $('#tChart');
    const loadChart = async () => {
      chartEl.innerHTML = '<div class="empty" style="padding:24px"><span class="loader"></span></div>';
      const pts = await Chart.hist(id, this.tradeRange);
      Chart.render(chartEl, pts, { h: 200 });
    };
    $$('#tRange button').forEach(b => b.addEventListener('click', () => {
      haptic('light');
      $$('#tRange button').forEach(x => x.classList.toggle('on', x === b));
      this.tradeRange = b.dataset.r;
      loadChart();
    }));
    loadChart();

    // Side
    $$('#tSide button').forEach(b => b.addEventListener('click', () => {
      haptic('light');
      this.tradeSide = b.dataset.side;
      this.renderTrade();
    }));
    // Type
    $$('#tType button').forEach(b => b.addEventListener('click', () => {
      haptic('light');
      this.tradeType = b.dataset.type;
      $$('#tType button').forEach(x => x.classList.toggle('on', x === b));
      $('#limitWrap').style.display = this.tradeType === 'market' ? 'none' : '';
      upd();
    }));

    // Watch
    const watchBtn = $('#watchBtn');
    const watched = (DB.settings.watch || []).includes(id);
    watchBtn.style.opacity = watched ? '1' : '0.5';
    watchBtn.addEventListener('click', () => {
      haptic('light');
      const w = new Set(DB.settings.watch || []);
      if (w.has(id)) w.delete(id); else w.add(id);
      DB.settings.watch = [...w];
      save();
      watchBtn.style.opacity = w.has(id) ? '1' : '0.5';
      toast(w.has(id) ? 'Добавлено в избранное' : 'Удалено');
    });

    // Quick chips
    const renderQuick = () => {
      const isBuySide = this.tradeSide === 'buy';
      const bal = DB.balances[cur] || 0n;
      let chips = [];
      if (isBuySide){
        [25, 50, 100, 250].forEach(v => chips.push([`$${v}`, () => {
          const qty = priceUSD > 0 ? mulNum(toB(v), 1/priceUSD) : 0n;
          $('#tQty').value = dStr(truncB(qty, 8)); upd();
        }]));
        if (bal > 0n){
          const usdBal = Market.toUSD(bal, cur);
          const qty = priceUSD > 0 ? mulNum(usdBal, 1/priceUSD) : 0n;
          chips.push(['Макс', () => { $('#tQty').value = dStr(truncB(qty, 8)); upd(); }]);
        }
      } else {
        if (pos && pos.qty > 0n){
          [[25,'25%'],[50,'50%'],[75,'75%'],[100,'100%']].forEach(([p,l]) => {
            chips.push([l, () => { $('#tQty').value = dStr(truncB(pos.qty * BigInt(p) / 100n, 8)); upd(); }]);
          });
        }
      }
      $('#tQuick').innerHTML = chips.map(([l], i) => `<button type="button" class="chip" data-i="${i}">${l}</button>`).join('');
      $$('#tQuick .chip').forEach(b => b.addEventListener('click', () => {
        haptic('light');
        chips[+b.dataset.i][1]();
      }));
    };
    renderQuick();

    const upd = () => {
      const qty = truncB(parseAmt($('#tQty').value, 8), 8);
      const limRaw = this.tradeType === 'limit' ? parseAmt($('#tLimit').value, 8) : 0n;
      const limUSD = this.tradeType === 'limit' && limRaw > 0n ? Number(dStr(limRaw)) : 0;
      const px = this.tradeType === 'limit' && limUSD > 0 ? limUSD : (a.price > 0 ? a.price : 0);
      const priceUSDNum = this.tradeType === 'limit' ? px / (Market.fiat?.[a.cur] || 1) : priceUSD;
      const totalUSD = qty > 0n ? roundB(mulNum(qty, priceUSDNum), 2) : 0n;
      const feeUSD = qty > 0n ? Orders.fee(totalUSD) : 0n;
      const isBuySide = this.tradeSide === 'buy';
      const payUSD = isBuySide ? totalUSD + feeUSD : totalUSD - feeUSD;

      $('#tPrice').textContent = fmtMoneyB(Market.fromUSD(priceUSD > 0 ? toB(priceUSD) : 0n, cur), cur, 2, 2).replace(/\.00/, m => m);
      $('#tPrice').textContent = fmtNum(priceUSD * (Market.fiat?.[cur] || 1), 2) + ' ' + cur;
      $('#tTotal').textContent = totalUSD > 0n ? fmtMoneyB(Market.fromUSD(totalUSD, cur), cur, 2, 2) : '—';
      $('#tFee').textContent = feeUSD > 0n ? fmtMoneyB(Market.fromUSD(feeUSD, cur), cur, 2, 2) : '—';
      $('#tPay').textContent = payUSD > 0n ? fmtMoneyB(Market.fromUSD(payUSD, cur), cur, 2, 2) : '—';

      const btn = $('#tGo');
      btn.disabled = false; btn.textContent = isBuySide ? 'Купить' : 'Продать';

      if (isBuySide){
        const avail = DB.balances[cur] || 0n;
        const need = Market.fromUSD(totalUSD + feeUSD, cur);
        $('#tAvail').textContent = fmtMoneyB(avail, cur, 2, 2);
        if (need > avail){ btn.disabled = true; btn.textContent = 'Недостаточно средств'; }
      } else {
        $('#tAvail').textContent = pos ? fmtQty(pos.qty) + ' шт' : '0 шт';
        if (!pos || qty > pos.qty){ btn.disabled = true; btn.textContent = 'Недостаточно актива'; }
      }
      if (qty <= 0n){ btn.disabled = true; btn.textContent = 'Введите количество'; }
    };
    $('#tQty').addEventListener('input', upd);
    $('#tLimit').addEventListener('input', upd);
    upd();

    // Плейс
    $('#tGo').addEventListener('click', async () => {
      const btn = $('#tGo'); if (btn.disabled) return;
      haptic('medium'); btn.disabled = true; btn.textContent = 'Обработка…';
      try {
        if (this.tradeType === 'limit'){ await Market.quote(a.sym, true).catch(() => {}); }
        const qty = truncB(parseAmt($('#tQty').value, 8), 8);
        let limUSD = 0;
        if (this.tradeType === 'limit'){
          const limRaw = parseAmt($('#tLimit').value, 8);
          limUSD = Number(dStr(limRaw)) / (Market.fiat?.[a.cur] || 1);
        }
        confirmSheet({
          title: this.tradeSide === 'buy' ? 'Подтверждение покупки' : 'Подтверждение продажи',
          rows: [
            ['Инструмент', a.sym],
            ['Тип', this.tradeType === 'limit' ? 'Лимитный' : 'Рыночный'],
            ['Количество', fmtQty(qty) + ' шт'],
            ['Цена', this.tradeType === 'limit' ? `$${fmtNum(limUSD)}` : `$${fmtNum(priceUSD)}`],
            ['Комиссия', this.tradeType === 'limit' ? '0.1%' : '0.1%']
          ],
          okText: this.tradeSide === 'buy' ? 'Купить' : 'Продать',
          onConfirm: () => {
            try {
              const order = Orders.place({
                assetId: id, side: this.tradeSide, type: this.tradeType, qty,
                limitPriceUSD: limUSD
              });
              hapticOk(); closeSheet();
              toast(order.status === 'filled' ? 'Сделка исполнена' : 'Ордер размещён');
              this.render();
            } catch(e){
              hapticErr(); closeSheet();
              toast(e.message || 'Ошибка', 'err');
            }
          }
        });
      } catch(e){ toast(e.message || 'Ошибка', 'err'); }
      finally { upd(); }
    });
  },

  /* ---- PORTFOLIO ---- */
  renderPortfolio(){
    const cur = DB.displayCurrency;
    const total = Portfolio.totalUSD();
    const free = Portfolio.freeUSD();
    const reserved = Portfolio.reservedUSD();
    const invested = Portfolio.costUSD();
    const pnl = Portfolio.pnlUSD();
    const pnlPct = invested > 0n ? Number(pnl) / Number(invested) * 100 : 0;
    const up = pnl >= 0n;

    $('#pfHero').innerHTML = `
      <div class="hero-l">Стоимость портфеля</div>
      <div class="pf-v">${DB.hideBalance ? '••••••' : fmtMoneyB(Market.fromUSD(total, cur), cur, 2, 2)}</div>
      <div style="margin-top:6px;font-size:13px;font-weight:700" class="${up ? 'up' : 'dn'}">
        ${DB.hideBalance || invested === 0n ? '' : `${up?'▲':'▼'} ${fmtMoneyB(Market.fromUSD(absB(pnl), cur), cur, 2, 2)} · ${(up?'+':'')}${pnlPct.toFixed(2)}%`}
      </div>
      <div class="pf-stats">
        <div><b>${DB.hideBalance ? '••••' : fmtMoneyB(Market.fromUSD(free, cur), cur, 2, 2)}</b><span>Свободно</span></div>
        <div><b>${DB.hideBalance ? '••••' : fmtMoneyB(Market.fromUSD(reserved, cur), cur, 2, 2)}</b><span>В ордерах</span></div>
        <div><b>${DB.hideBalance ? '••••' : fmtMoneyB(Market.fromUSD(invested, cur), cur, 2, 2)}</b><span>Вложено</span></div>
      </div>`;

    const list = Portfolio.positionsList();
    $('#pfPosCnt').textContent = list.length ? list.length + ' шт' : '';
    $('#pfPositions').innerHTML = list.length ? list.map(p => {
      const up = p.pl >= 0n;
      return `<div class="asset" data-id="${esc(p.key)}">
        ${assetIcon(p.key)}
        <div class="asset-m">
          <div class="asset-t">${esc(p.sym)}</div>
          <div class="asset-s">${fmtQty(p.qty)} × ${fmtMoneyB(Market.fromUSD(p.avgUSD, cur), cur, 2, 2)}</div>
        </div>
        <div class="asset-r">
          <div class="asset-p">${DB.hideBalance ? '••••' : fmtMoneyB(Market.fromUSD(p.valueUSD, cur), cur, 2, 2)}</div>
          <div class="asset-c ${up?'up':'dn'}">${DB.hideBalance ? '' : `${up?'+':''}${fmtMoneyB(Market.fromUSD(p.pl, cur), cur, 2, 2)} · ${(up?'+':'')}${p.pct.toFixed(2)}%`}</div>
        </div>
      </div>`;
    }).join('') : '<div class="empty">Нет открытых позиций</div>';
    $$('#pfPositions .asset').forEach(r => r.addEventListener('click', () => {
      haptic('light'); this.tradeId = r.dataset.id; this.nav('trade');
    }));
  },

  /* ---- HISTORY ---- */
  renderHistory(){
    const cur = DB.displayCurrency;
    let list = DB.txs.slice();
    if (this.histFilter !== 'all') list = list.filter(t => t.type === this.histFilter);
    list = list.slice(0, 300);
    $('#hList').innerHTML = list.length ? list.map(t => {
      const cls = t.amountClass === 'pos' ? 'up' : t.amountClass === 'neg' ? 'dn' : 'au';
      const ic = t.type === 'deposit' ? '+' : t.type === 'transfer' ? '→' : t.type === 'exchange' ? '⇄' : t.type === 'crypto' ? '₿' : t.type === 'stock' ? '📈' : '•';
      return `<div class="row">
        <div class="row-ic ${t.amountClass === 'pos' ? 'up' : t.amountClass === 'neg' ? 'dn' : 'au'}">${ic}</div>
        <div class="row-main">
          <div class="row-t">${esc(t.title)}</div>
          <div class="row-s">${[esc(t.subtitle), new Date(t.date).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="row-r"><div class="row-v ${cls}">${esc(t.amountText)}</div></div>
      </div>`;
    }).join('') : '<div class="empty">Операций нет</div>';
  }
};

    <div class="field"><div class="inp" style="height:46px"><input id="curSrch" placeholder="Поиск валюты..." autocomplete="off"></div></div>
    <div class="panel" id="curList" style="max-height:52vh;overflow-y:auto">${list.map(c => `
      <div class="row tap" data-c="${c}">

        <div class="row-main"><div class="row-t">${esc(c)}</div><div class="row-s">${esc(curName(c))}</div></div>
        ${c === DB.displayCurrency ? '<div class="row-v au">✓</div>' : ''}
      </div>`).join('')}</div>
    <div style="height:8px"></div>`);
  $('#curSrch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $$('#curList .row').forEach(el => {
      const c = el.dataset.c;
      el.style.display = (!q || c.toLowerCase().includes(q) || curName(c).toLowerCase().includes(q)) ? '' : 'none';

  $('#curList').addEventListener('click', e => {
    const r = e.target.closest('.row'); if (!r) return;
    const c = r.dataset.c; closeSheet();
    if (c === DB.displayCurrency) return;
    DB.displayCurrency = c; save(); hapticOk();
    setTimeout(() => App.render(), 260);
  });
}

   БАНКОВСКИЕ ФУНКЦИИ (депозит, перевод, обмен)
   ============================================================= */
function openDeposit(){
  const cur = DB.displayCurrency;
  openSheet(`
    <div class="sh-handle"></div>
    <div class="sh-head"><div class="sh-t">Пополнение</div><button class="sh-close" data-close><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="field"><div class="field-l">Валюта</div>
      <div class="sel"><select id="depCur">${Object.keys(Market.fiat||{USD:1}).sort().map(c => `<option value="${c}"${c===cur?' selected':''}>${c} — ${esc(curName(c))}</option>`).join('')}</select>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div></div>
    <div class="field"><div class="field-l">Сумма</div>
      <div class="inp"><input id="depAmt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
      <div class="suf" id="depCurLbl">${cur}</div></div>
      <div class="td-quick" id="depQuick"></div>
    </div>
    <div class="td-rows"><div class="td-row"><span>Текущий баланс</span><b id="depBal">—</b></div>
    <div class="td-row"><span>Новый баланс</span><b id="depAfter">—</b></div></div>
    <div style="padding:16px 18px 0"><button class="btn btn-primary" id="depGo">Пополнить</button></div><div style="height:8px"></div>`);
  const upd = () => {
    const c = $('#depCur').value;
    const amt = truncB(parseAmt($('#depAmt').value, 8), 2);
    const bal = DB.balances[c] || 0n;
    $('#depCurLbl').textContent = c;
    $('#depBal').textContent = fmtMoneyB(bal, c, 2, 2);
    $('#depAfter').textContent = amt > 0n ? fmtMoneyB(bal + amt, c, 2, 2) : '—';
    const q = [50, 100, 500, 1000, 5000];
    if ($('#depQuick').dataset.cur !== c){
      $('#depQuick').dataset.cur = c;
      $('#depQuick').innerHTML = q.map(v => `<button type="button" class="chip" data-v="${v}">+${v}</button>`).join('');
      $$('#depQuick .chip').forEach(b => b.addEventListener('click', () => {
        $('#depAmt').value = formatAmountInput(b.dataset.v); upd();
      }));
    }
  };
  $('#depCur').addEventListener('change', upd);
  $('#depAmt').addEventListener('input', upd);
  upd();
  $('#depGo').addEventListener('click', () => {
    const c = $('#depCur').value;
    const amt = truncB(parseAmt($('#depAmt').value, 8), 2);
    if (!(amt > 0n)) return toast('Введите сумму', 'err');
    DB.balances[c] = (DB.balances[c] || 0n) + amt;
    DB.txs.unshift({ id: uid(), type: 'deposit', title: 'Пополнение', subtitle: c, amountText: '+' + fmtMoneyB(amt, c, 2, 2), amountClass: 'pos', date: new Date().toISOString() });
    save(); hapticOk(); closeSheet(); toast('Пополнено'); App.render();
  });
}

function openTransfer(){
  const cur = DB.displayCurrency;
  openSheet(`
    <div class="sh-handle"></div>
    <div class="sh-head"><div class="sh-t">Перевод</div><button class="sh-close" data-close><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="field"><div class="field-l">Получатель</div>
      <div class="inp"><input id="trR" placeholder="Имя или ID" autocomplete="off"></div></div>
    <div class="field"><div class="field-l">Сумма</div>
      <div class="inp"><input id="trA" type="text" inputmode="decimal" placeholder="0"><div class="suf">${cur}</div></div></div>
    <div class="field"><div class="field-l">Комментарий</div>
      <div class="inp"><input id="trN" maxlength="60" placeholder="Необязательно" autocomplete="off"></div></div>
    <div class="td-rows"><div class="td-row"><span>Доступно</span><b>${fmtMoneyB(DB.balances[cur]||0n, cur, 2, 2)}</b></div></div>
    <div style="padding:16px 18px 0"><button class="btn btn-primary" id="trGo">Отправить</button></div><div style="height:8px"></div>`);
  $('#trGo').addEventListener('click', () => {
    const rec = $('#trR').value.trim();
    const amt = truncB(parseAmt($('#trA').value, 8), 2);
    const note = $('#trN').value.trim().slice(0, 60);
    const av = DB.balances[cur] || 0n;
    if (!rec) return toast('Введите получателя', 'err');
    if (!(amt > 0n)) return toast('Введите сумму', 'err');
    if (amt > av) return toast('Недостаточно средств', 'err');
    confirmSheet({
      title: 'Подтверждение перевода',
      rows: [['Получатель', rec], ...(note ? [['Комментарий', note]] : []), ['Сумма', fmtMoneyB(amt, cur, 2, 2)]],
      okText: 'Отправить',
      onConfirm: () => {
        if (amt > (DB.balances[cur] || 0n)){ closeSheet(); return toast('Недостаточно средств', 'err'); }
        DB.balances[cur] -= amt;
        if (DB.balances[cur] <= 0n) delete DB.balances[cur];
        DB.txs.unshift({ id: uid(), type: 'transfer', title: 'Перевод', subtitle: rec + (note ? ' · ' + note : ''), amountText: '-' + fmtMoneyB(amt, cur, 2, 2), amountClass: 'neg', date: new Date().toISOString() });
        save(); hapticOk(); closeSheet(); toast('Отправлено'); App.render();
      }
    });
  });
}

    <div class="field"><div class="field-l">Отдаёте</div>

    <div class="td-rows"><div class="td-row"><span>Курс</span><b id="exRate">—</b></div>
      <div class="td-row"><span>Комиссия (0.5%)</span><b id="exFee">—</b></div>
      <div class="td-row"><span>Доступно</span><b id="exAv">—</b></div></div>
    <div style="padding:16px 18px 0"><button class="btn btn-primary" id="exGo">Обменять</button></div><div style="height:8px"></div>`);
  const f = $('#exF'), t = $('#exT'), a = $('#exA'), r = $('#exR');
  f.value = DB.displayCurrency; t.value = f.value === 'USD' ? 'EUR' : 'USD';
  const upd = () => {
    const rate = (Market.fiat[f.value] || 1) / (Market.fiat[t.value] || 1);
    $('#exRate').textContent = `1 ${f.value} = ${fmtNum(rate, 6)} ${t.value}`;
    const amt = truncB(parseAmt(a.value, 8), 2);
    const gross = mulNum(amt, rate);
    const fee = roundB(mulNum(gross, 0.005), 2);
    const net = roundB(gross - fee, 2);
    r.value = net > 0n ? fmtQty(net, 2) : '';
    $('#exFee').textContent = fmtQty(fee, 2) + ' ' + t.value;
    $('#exAv').textContent = fmtMoneyB(DB.balances[f.value] || 0n, f.value, 2, 2);
  };
  [f, t].forEach(s => s.addEventListener('change', upd));
  a.addEventListener('input', upd);
  upd();
  $('#exGo').addEventListener('click', () => {
    const rate = (Market.fiat[f.value] || 1) / (Market.fiat[t.value] || 1);
    const amt = truncB(parseAmt(a.value, 8), 2);
    if (!(amt > 0n)) return toast('Введите сумму', 'err');
    if (amt > (DB.balances[f.value] || 0n)) return toast('Недостаточно средств', 'err');
    const gross = mulNum(amt, rate);
    const fee = roundB(mulNum(gross, 0.005), 2);
    const net = roundB(gross - fee, 2);
    DB.balances[f.value] -= amt; if (DB.balances[f.value] <= 0n) delete DB.balances[f.value];
    DB.balances[t.value] = (DB.balances[t.value] || 0n) + net;
    DB.txs.unshift({ id: uid(), type: 'exchange', title: `${f.value} → ${t.value}`, subtitle: `${fmtQty(amt,2)} ${f.value}`, amountText: '+' + fmtMoneyB(net, t.value, 2, 2), amountClass: 'au', date: new Date().toISOString() });
    save(); hapticOk(); closeSheet(); toast('Обмен выполнен'); App.render();
  });
}

    DB.settings.pinHash = passHash(n); save(); hapticOk(); closeSheet(); toast('PIN изменён');
  });
}

/* =============================================================
   AUTH — PIN-экран
   ============================================================= */
let pin = '', unlocked = false, checking = false;
const SESSION = 'sayfer_sess';
const IDLE_MS = 10 * 60 * 1000;
function touchSession(){ try { sessionStorage.setItem(SESSION, String(Date.now())); } catch(e){} }
function endSession(){
  try { sessionStorage.removeItem(SESSION); } catch(e){}
  location.reload();
}
function pinError(){
  hapticErr();
  const dots = $$('#lkDots .lk-dot');
  dots.forEach(d => { d.classList.remove('on'); d.classList.add('err'); });
  $('#lkMsg').classList.add('on');
  $('#lock').classList.add('shake');
  setTimeout(() => {
    $('#lock').classList.remove('shake');
    setTimeout(() => {
      pin = ''; checking = false;
      dots.forEach(d => d.classList.remove('err','on'));
      $('#lkMsg').classList.remove('on');
    }, 320);
  }, 340);
}
function pinUpdate(){
  $$('#lkDots .lk-dot').forEach((d,i) => d.classList.toggle('on', i < pin.length));
}
function pinKey(k){
  if (checking || unlocked) return;
  haptic('light');
  if (k === 'del'){ pin = pin.slice(0,-1); pinUpdate(); return; }
  if (!/^\d$/.test(k)) return;
  if (pin.length >= 4) return;
  pin += k; pinUpdate();
  if (pin.length === 4){
    checking = true;
    setTimeout(() => {
      const target = typeof DB.settings.pinHash === 'number' ? DB.settings.pinHash : passHash('3525');
      if (passHash(pin) === target) pinSuccess();
      else pinError();
    }, 130);
  }
}
function pinSuccess(){
  if (unlocked) return;
  unlocked = true; touchSession();
  hapticOk();
  $('#lock').classList.add('hide');
  setTimeout(() => $('#lock').style.display = 'none', 460);
  $('#app').classList.add('on');
  bootApp();
}
$('#lkPad').addEventListener('click', e => {
  const b = e.target.closest('.lk-key');
  if (!b || !b.dataset.k) return;
  pinKey(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ov.classList.contains('on')) return closeSheet();
  if ($('#lock').classList.contains('hide')) return;
  if (e.key === 'Backspace') pinKey('del');
  else if (/^\d$/.test(e.key)) pinKey(e.key);
});

   ============================================================= */
async function bootApp(){
  // приветствие
  const h = new Date().getHours();
  const g = h >= 5 && h < 12 ? 'Доброе утро' : h >= 12 && h < 18 ? 'Добрый день' : h >= 18 && h < 23 ? 'Добрый вечер' : 'Доброй ночи';
  $('#brandName').textContent = g;
  $('#avatar').textContent = (DB.user.firstName || 'S')[0].toUpperCase();

  // загрузка данных
  await Market.loadFiat();
  await Promise.all([ Market.loadCrypto(), Market.loadStocks() ]);
  App.render();

  // периодическое обновление ордеров и цен
  setInterval(() => {
    if (document.hidden) return;
    Market.loadCrypto(true);
    Market.loadStocks(true);
    Orders.tick();
  }, 60000);

  setInterval(() => Orders.tick(), 15000);
}

/* Idle */
(function(){
  let last = Date.now(), timer;
  const arm = () => {
    last = Date.now(); clearTimeout(timer);
    if (unlocked) touchSession();
    timer = setTimeout(() => { if (unlocked) endSession(); }, IDLE_MS);
  };
  ['pointerdown','keydown','touchstart','input'].forEach(ev => document.addEventListener(ev, arm, { passive:true }));
  document.addEventListener('scroll', arm, { passive:true, capture:true });
  const check = () => { if (unlocked && Date.now() - last >= IDLE_MS) endSession(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('pageshow', check);
  arm();
})();

/* Session restore */
(function(){
  let t = 0;
  try { t = parseInt(sessionStorage.getItem(SESSION) || '0', 10) || 0; } catch(e){}
  if (t && Date.now() - t < IDLE_MS){
    $('#lock').style.display = 'none';
    unlocked = true;
    $('#app').classList.add('on');
    bootApp();
  } else if (t){ try { sessionStorage.removeItem(SESSION); } catch(e){} }
})();

/* Save on hide */
window.addEventListener('pagehide', () => save());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
